name: Build
on: [push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        arch: [x86, x86_64, arm64]
        exclude:
          - os: windows-latest
            arch: arm64
        include:
          # Windows
          - os: windows-latest
            arch: x86
            platform: windows
          - os: windows-latest
            arch: x86_64
            platform: windows
          # Linux
          - os: ubuntu-latest
            arch: x86
            platform: linux
          - os: ubuntu-latest
            arch: x86_64
            platform: linux
          - os: ubuntu-latest
            arch: arm64
            platform: linux

    steps:
    - uses: actions/checkout@v7
    
    - name: Install dependencies
      if: ${{ matrix.os != 'windows-latest' }}
      shell: bash
      run: |
        sudo apt-get update # && sudo apt-get upgrade -y
        sudo apt-get install -y build-essential p7zip-full
        # 32-bit and multilib support only exists/is needed on x86 hosts;
        # there's no i386 or multilib package on the arm64 runner
        if [ "${{ matrix.arch }}" == "x86" ]; then
          sudo apt-get install -y libc6-dev-i386 g++-multilib
        fi
        if [ "${{ matrix.arch }}" != "arm64" ]; then
          sudo apt-get install -y gcc-mingw-w64
        fi
        if [ "${{ matrix.arch }}" == "arm64" ]; then
          sudo apt-get install -y gcc-aarch64-linux-gnu
        fi

    - name: Install llvm-mingw (arm64 Windows cross-compile)
      if: ${{ matrix.os != 'windows-latest' && matrix.arch == 'arm64' }}
      shell: bash
      run: |
        LLVM_MINGW_VERSION=20241203
        HOST_ARCH=$(uname -m)
        curl -L -o llvm-mingw.tar.xz \
          "https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-${HOST_ARCH}.tar.xz"
        tar -xf llvm-mingw.tar.xz
        echo "$PWD/llvm-mingw-${LLVM_MINGW_VERSION}-ucrt-ubuntu-20.04-${HOST_ARCH}/bin" >> "$GITHUB_PATH"

    - name: Build for ${{ matrix.os }} ${{ matrix.arch }}
      shell: bash
      run: |
        if [ "${{ matrix.os }}" == "windows-latest" ]; then
          # Windows build steps
          ./build.bat
        else
          # Linux build steps
          mkdir -p binaries/release-${{ matrix.platform }}-${{ matrix.arch }}
          make -j14 install ARCH="${{ matrix.arch }}" DESTDIR=./binaries/release-${{ matrix.platform }}-${{ matrix.arch }}
          mkdir -p binaries/debug-${{ matrix.platform }}-${{ matrix.arch }}
          make -j14 install_debug ARCH="${{ matrix.arch }}" DESTDIR=./binaries/debug-${{ matrix.platform }}-${{ matrix.arch }}

          # that also works:
          mkdir -p binaries/release-windows-${{ matrix.arch }}
          make -j14 install PLATFORM=windows ARCH="${{ matrix.arch }}" DESTDIR=./binaries/release-windows-${{ matrix.arch }}
          mkdir -p binaries/debug-windows-${{ matrix.arch }}
          make -j14 install_debug PLATFORM=windows ARCH="${{ matrix.arch }}" DESTDIR=./binaries/debug-windows-${{ matrix.arch }}

          # Get wine32-development package
          # sudo dpkg --add-architecture i386 && sudo apt-get update && sudo apt-get install -y wine32-development
          # Build QVM using wine
          # wine cmd /c build.bat

          sudo chmod 777 tools/bin/linux/* # make all of them executable
          make -f MakefileQVM -j8
        fi
      env:
        ARCHIVE: 1

    - name: Store QVM artifacts
      # store only once, from Linux x86_64
      if: ${{ matrix.os != 'windows-latest' && matrix.arch == 'x86_64' }}
      uses: actions/upload-artifact@v7
      with:
        name: QVMs
        path: |
          *.pk3
        archive: false
        if-no-files-found: error
        retention-days: 5

    - name: Store Linux release ${{ matrix.arch }} .so artifacts
      if: ${{ matrix.os != 'windows-latest' }}
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ matrix.platform }}-${{ matrix.arch }}
        path: |
          binaries/release-${{ matrix.platform }}-${{ matrix.arch }}
        if-no-files-found: error
        retention-days: 5

    - name: Store Linux debug ${{ matrix.arch }} .so artifacts
      if: ${{ matrix.os != 'windows-latest' }}
      uses: actions/upload-artifact@v7
      with:
        name: debug-${{ matrix.platform }}-${{ matrix.arch }}
        path: |
          binaries/debug-${{ matrix.platform }}-${{ matrix.arch }}
        if-no-files-found: error
        retention-days: 5

    - name: Store Windows release ${{ matrix.arch }} DLL artifacts (compiled on Linux)
      if: ${{ matrix.os != 'windows-latest' }}
      uses: actions/upload-artifact@v7
      with:
        name: release-windows-${{ matrix.arch }}
        path: |
          binaries/release-windows-${{ matrix.arch }}
        if-no-files-found: error
        retention-days: 5

    - name: Store Windows debug ${{ matrix.arch }} DLL artifacts (compiled on Linux)
      if: ${{ matrix.os != 'windows-latest' }}
      uses: actions/upload-artifact@v7
      with:
        name: debug-windows-${{ matrix.arch }}
        path: |
          binaries/debug-windows-${{ matrix.arch }}
        if-no-files-found: error
        retention-days: 5

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
    - uses: actions/checkout@v7

    - name: Build native macOS
      shell: bash
      run: |
        mkdir -p binaries/release-darwin-${{ matrix.arch }}
        make -j$(sysctl -n hw.ncpu) install ARCH="${{ matrix.arch }}" DESTDIR=./binaries/release-darwin-${{ matrix.arch }}
        mkdir -p binaries/debug-darwin-${{ matrix.arch }}
        make -j$(sysctl -n hw.ncpu) install_debug ARCH="${{ matrix.arch }}" DESTDIR=./binaries/debug-darwin-${{ matrix.arch }}
      env:
        ARCHIVE: 1

    - name: Store macOS release ${{ matrix.arch }} .dylib artifacts
      uses: actions/upload-artifact@v7
      with:
        name: release-darwin-${{ matrix.arch }}
        path: |
          binaries/release-darwin-${{ matrix.arch }}
        if-no-files-found: error
        retention-days: 5

    - name: Store macOS debug ${{ matrix.arch }} .dylib artifacts
      uses: actions/upload-artifact@v7
      with:
        name: debug-darwin-${{ matrix.arch }}
        path: |
          binaries/debug-darwin-${{ matrix.arch }}
        if-no-files-found: error
        retention-days: 5